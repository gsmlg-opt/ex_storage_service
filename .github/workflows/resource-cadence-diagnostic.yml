name: Incomplete resource cadence diagnostic

on:
  workflow_dispatch:
    inputs:
      scheduler_accounting:
        description: 'Enable scheduler wait accounting on this disposable VM'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: resource-cadence-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  PAGER: cat
  MIX_ENV: prod
  ERL_FLAGS: '+S 4:4 +SDcpu 2 +SDio 2'
  ESS_MASTER_KEY: disposable-hardening-ci-master-key
  ESS_ADMIN_PASSWORD_HASH: c89aca9f1fbfa8dc9383ff1f97a9c0f64a9bb6c1f456f00f2888c2e2fb733d14
  SECRET_KEY_BASE: disposable-hardening-ci-secret-key-base-must-have-sixty-four-bytes-12345
  DIAGNOSTIC_LABEL: cadence-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  diagnostic:
    name: Both data observers / original cluster groups 1–6 / not acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize incomplete diagnostic artifact before prerequisites
        run: python3 -B e2e/diagnostics/resource_cadence/run.py --label "$DIAGNOSTIC_LABEL" --initialize
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '28'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.91.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-cadence-diagnostic-prod-${{ hashFiles('mix.lock') }}
      - name: Install the unchanged harness prerequisites and tracer
        run: |
          python3 e2e/scripts/ci_isolation.py --output "docs/reports/s3-hardening/$DIAGNOSTIC_LABEL/isolation"
          sudo -n apt-get install --yes ripgrep strace
          rg --version
          strace --version > "docs/reports/s3-hardening/$DIAGNOSTIC_LABEL/strace-version.txt"
          python3 -m venv "$RUNNER_TEMP/hardening-venv"
          "$RUNNER_TEMP/hardening-venv/bin/pip" install -r e2e/hardening-requirements.txt
          python3 scripts/release/reserve_journal_ports.py
          mix deps.get
          npm ci
      - name: Record scheduler accounting and optional disposable-VM enablement
        env:
          ENABLE_SCHEDULER_ACCOUNTING: ${{ inputs.scheduler_accounting }}
        run: |
          accounting="docs/reports/s3-hardening/$DIAGNOSTIC_LABEL/scheduler-accounting.txt"
          sysctl kernel.sched_schedstats | tee "$accounting"
          if [[ "$ENABLE_SCHEDULER_ACCOUNTING" == true ]]; then
            test "$GITHUB_ACTIONS" = true
            test "$RUNNER_ENVIRONMENT" = github-hosted
            sudo -n sysctl -w kernel.sched_schedstats=1 | tee -a "$accounting"
          fi
          sysctl kernel.sched_schedstats | tee -a "$accounting"
      - name: Validate pure fixtures and compile production source
        run: |
          "$RUNNER_TEMP/hardening-venv/bin/python" -B e2e/diagnostics/resource_cadence/test_diagnostic.py
          mix compile --force --warnings-as-errors
      - name: Run one 900-second bounded diagnostic with original resource gates
        run: |
          "$RUNNER_TEMP/hardening-venv/bin/python" -B e2e/diagnostics/resource_cadence/run.py \
            --python "$RUNNER_TEMP/hardening-venv/bin/python" --label "$DIAGNOSTIC_LABEL"
      - name: Retain incomplete diagnostic and raw evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incomplete-resource-cadence-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/reports/s3-hardening/${{ env.DIAGNOSTIC_LABEL }}*
          if-no-files-found: error
          retention-days: 14
