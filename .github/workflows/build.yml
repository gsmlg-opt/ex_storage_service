name: Build Docker Image

on:
  push:
    branches:
      - main
    # Workflow-only build changes are checked on PRs or by explicit dispatch.
    paths-ignore:
      - "apps/ex_storage_service_cli/**"
      - "docs/**"
      - "scripts/cli_compatibility/**"
      - ".github/workflows/publish-cli.yml"
      - ".github/workflows/cli-compatibility.yml"
      - ".github/workflows/build.yml"
      - ".gitignore"
      - "**/*.md"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/gsmlg-dev/ess
  # Opt into Node.js 24 now, ahead of the June 2nd 2026 forced migration.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: gsmlg-dev
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge
            type=sha,prefix=sha-

      - name: Capture build metadata
        id: build_info
        env:
          BUILD_GIT_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          {
            printf 'git_ref=%s\n' "$BUILD_GIT_REF"
            printf 'git_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'build_time=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ESS_BUILD_GIT_REF=${{ steps.build_info.outputs.git_ref }}
            ESS_BUILD_GIT_SHA=${{ steps.build_info.outputs.git_sha }}
            ESS_BUILD_TIME=${{ steps.build_info.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
