name: Test

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGER: cat
  MIX_ENV: test
  ELIXIR_VERSION: "1.19"
  OTP_VERSION: "28"

jobs:
  test:
    name: Core, S3, transport and web correctness
    runs-on: ubuntu-24.04
    env:
      # This isolated job runs Mix sequentially; avoid elixir-lang/elixir#15761.
      MIX_OS_CONCURRENCY_LOCK: '0'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned independent client for harness contract imports
        run: python3 -m pip install -r e2e/hardening-requirements.txt

      - name: Reserve explicit journal mutex ports on the test runner
        run: python3 scripts/release/reserve_journal_ports.py

      - name: Install CLI contract shell and isolated observer prerequisites
        run: python3 e2e/scripts/ci_isolation.py --output docs/reports/s3-hardening/isolation-ci-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix compile --force --warnings-as-errors
      - name: Run complete fast suites and retain actual selection/counts
        run: python3 e2e/run_correctness_tests.py --output docs/reports/s3-hardening/correctness-ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify acceptance harness and release gate contracts
        run: python3 -m unittest discover -s e2e -p 'test_*.py'
      - name: Retain correctness evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correctness-selection-and-results
          path: docs/reports/s3-hardening/correctness-ci-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
      - name: Retain namespace prerequisite diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correctness-isolation-prerequisite
          path: docs/reports/s3-hardening/isolation-ci-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
