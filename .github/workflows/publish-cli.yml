name: Publish CLI to Hex.pm

on:
  workflow_call:
    inputs:
      git_ref:
        description: "Canonical committed release tag"
        required: true
        type: string
      version:
        description: "Shared committed version"
        required: true
        type: string
    secrets:
      HEX_API_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: publish-cli-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/ex_storage_service_cli

env:
  PAGER: cat
  ELIXIR_VERSION: "1.19.6"
  OTP_VERSION: "28.5.0.8"
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  publish:
    name: Publish ess v${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reserve explicit journal mutex ports on the test runner
        working-directory: .
        run: python3 scripts/release/reserve_journal_ports.py
      - name: Validate committed canonical release
        working-directory: .
        env:
          RELEASE_REF: ${{ inputs.git_ref }}
        run: |
          test "$RELEASE_REF" = "v$RELEASE_VERSION"
          python3 scripts/release/release.py validate --version "$RELEASE_VERSION" --output "$RUNNER_TEMP/cli-source.json"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Install the shell used by CLI completion contract tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - name: Validate inventories and scoped CLI implementation
        run: |
          python3 ../../scripts/cli_compatibility/generate.py --check
          python3 -m unittest discover -s ../../scripts/cli_compatibility -p 'test_*.py'
          mix deps.get
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix test
        env:
          MIX_ENV: test
      - name: Build and independently install the exact source package
        working-directory: .
        run: >-
          python3 scripts/cli_compatibility/package_probe.py
          --expected-version "$RELEASE_VERSION"
          --output-dir "$RUNNER_TEMP/cli-package"
      - name: Reuse an identical existing Hex package
        id: registry
        working-directory: .
        run: |
          python3 scripts/cli_compatibility/verify_published.py \
            --version "$RELEASE_VERSION" \
            --manifest "$RUNNER_TEMP/cli-package/manifest.json" \
            --candidate-package "$RUNNER_TEMP/cli-package/ex_storage_service_cli.tar" \
            --allow-missing \
            --status-file "$RUNNER_TEMP/cli-registry-status.json" \
            --output "$RUNNER_TEMP/published-cli.tar"
          python3 - <<'PY'
          import json, os, pathlib
          status = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'cli-registry-status.json').read_text())['status']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'status={status}\n')
          PY
      - name: Publish source package and documentation to Hex.pm
        if: steps.registry.outputs.status == 'absent'
        run: |
          mix deps.get
          mix hex.publish --yes
        env:
          MIX_ENV: dev
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      - name: Verify newly published registry bytes
        if: steps.registry.outputs.status == 'absent'
        working-directory: .
        run: |
          python3 scripts/cli_compatibility/verify_published.py \
            --version "$RELEASE_VERSION" \
            --manifest "$RUNNER_TEMP/cli-package/manifest.json" \
            --candidate-package "$RUNNER_TEMP/cli-package/ex_storage_service_cli.tar" \
            --status-file "$RUNNER_TEMP/cli-registry-status.json" \
            --output "$RUNNER_TEMP/published-cli.tar"
      - name: Verify a fresh published consumer
        working-directory: .
        run: |
          python3 scripts/cli_compatibility/package_probe.py \
            --package "$RUNNER_TEMP/published-cli.tar" \
            --expected-version "$RELEASE_VERSION" \
            --output-dir "$RUNNER_TEMP/published-consumer"
      - name: Prepare downloadable executable and evidence
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/cli-release"
          cp "$RUNNER_TEMP/cli-package/ess" "$RUNNER_TEMP/cli-release/ess-linux-x86_64-otp28"
          cp "$RUNNER_TEMP/cli-package/manifest.json" "$RUNNER_TEMP/cli-release/build-manifest.json"
          cp "$RUNNER_TEMP/published-consumer/manifest.json" "$RUNNER_TEMP/cli-release/published-consumer.json"
          cp "$RUNNER_TEMP/cli-registry-status.json" "$RUNNER_TEMP/cli-release/registry-verification.json"
          cp "$RUNNER_TEMP/cli-source.json" "$RUNNER_TEMP/cli-release/cli-source.json"
          cp docs/cli/compatibility/reference-lock.json docs/cli/compatibility/coverage.md \
            docs/cli/compatibility/release-notes.md docs/cli/compatibility/milestone-acceptance-status.md \
            "$RUNNER_TEMP/cli-release/"
          cp apps/ex_storage_service_cli/README.md "$RUNNER_TEMP/cli-release/README.md"
          cp apps/ex_storage_service_cli/LICENSE "$RUNNER_TEMP/cli-release/LICENSE"
          python3 - <<'PY'
          import hashlib, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cli-release'
          lines = []
          for path in sorted(root.iterdir()):
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              lines.append(f'{digest}  {path.name}\n')
          (root / 'SHA256SUMS').write_text(''.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ess-v${{ inputs.version }}-linux-x86_64-otp28
          path: ${{ runner.temp }}/cli-release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cli-publish-validation-logs
          path: |
            ${{ runner.temp }}/cli-package/commands.json
            ${{ runner.temp }}/published-consumer/commands.json
          if-no-files-found: warn
